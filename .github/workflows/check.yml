name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scripts:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: shellcheck and the version test
        run: |
          set -eu
          shellcheck scripts/*.sh tests/*.sh
          sh tests/nightly-version-test.sh
          sh tests/nightly-newest-test.sh
